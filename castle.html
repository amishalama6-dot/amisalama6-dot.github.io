<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Infinite Castle of Hidden Doors</title>
<style>
:root{color-scheme:dark;--bg:#120d1f;--fg:#f1ebff;--pn:#241a3d;--ac:#e0476b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{max-width:420px;margin:0 auto;padding:6px}
#hud{display:flex;justify-content:space-between;font-size:13px;padding:4px 2px;gap:6px;flex-wrap:wrap}
#wrap{position:relative}
canvas{width:100%;display:block;border-radius:10px;background:#000}
#ov{position:absolute;inset:0;background:#120d1fee;border-radius:10px;overflow:auto;padding:10px;box-sizing:border-box;text-align:center}
#ov h1{font-size:20px;margin:4px 0}#ov p{font-size:12px;margin:4px 0;opacity:.85}
.c{display:block;width:100%;margin:5px 0;padding:8px;background:var(--pn);color:var(--fg);border:1px solid #5a4a8a;border-radius:8px;font-size:13px;text-align:left}
.c:disabled{opacity:.35}.c small{display:block;opacity:.75}
#ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#dp{display:flex;gap:6px}
#dp button,#ab button{background:var(--pn);color:var(--fg);border:1px solid #5a4a8a;border-radius:14px;font-size:22px;touch-action:none;width:60px;height:66px}
#ab{display:grid;grid-template-columns:repeat(2,78px);gap:6px}#ab #bp{grid-column:1/3;height:46px!important}#ab button{width:78px;height:58px;font-size:14px}#ab button.s{background:var(--ac)}
.go{background:var(--ac)!important;text-align:center!important;font-weight:700}
</style></head><body>
<div id="app">
<div id="hud"><span id="tm">⏱ --</span><span id="sc">Score 0</span><span id="dr">🚪 0</span><span id="ch">—</span></div>
<div id="wrap"><canvas id="cv" width="360" height="400"></canvas><div id="ov"></div></div>
<div id="ctl">
<div id="dp"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">▲</button></div>
<div id="ab"><button id="bf">👊 Punch</button><button class="s" id="bs">⚔ Sword</button><button id="bp">✨ Power</button></div>
</div>
<p style="font-size:11px;opacity:.6;margin:6px 0">◀ ▶ arrows run · ▲ enter door · Space = sword · ▼ or Shift = punch · Right-click = power</p>
</div>
<script>
const W=[
{n:'Ocean',e:'🌊',c:'#1e6fb8',ch:'Kagaya',p:'Water: +8 seconds',s:['#0b2a52','#2a7fb8'],g:'#2b4a63'},
{n:'Burning Village',e:'🔥',c:'#c4501b',ch:'Giyu',p:'Fire: burns a demon from afar',s:['#2a0505','#d2561c'],g:'#3a1a10'},
{n:'Flowers',e:'🌸',c:'#b04a8f',ch:'Kocho',p:'Poison: demon takes damage in 4s',s:['#e08fb8','#fbe3ee'],g:'#6a8f4a'},
{n:'City',e:'🏙️',c:'#4a5a78',ch:'Iguro',p:'Swap: jump behind the demon',s:['#0a0f24','#3b4a7a'],g:'#2a2f40'},
{n:'Train',e:'🚂',c:'#7a5a2a',ch:'Kanroji',p:'Hit & run: fast + long reach 4s',s:['#3a1f4a','#f08a4a'],g:'#4a3a2a'},
{n:'Festival',e:'🏮',c:'#b3892a',ch:'Amane',p:'Invisible 7s: demon cannot escape',s:['#1a0f2e','#7a3a6a'],g:'#3a2a1a'},
{n:'Cursed School',e:'🏫',c:'#3f7a5a',ch:'Gyomei',p:'Next strike does double damage',s:['#06150f','#2f6a4a'],g:'#1d2a22'}];
const cv=document.getElementById('cv'),g=cv.getContext('2d'),ov=document.getElementById('ov'),$=id=>document.getElementById(id);
let save={u:[0],d:[0,0,0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem('mcs'));if(s&&s.u&&s.d)save=s}catch(e){}
const store=()=>{try{localStorage.setItem('mcs',JSON.stringify(save))}catch(e){}};
const lvl=i=>[3,5,7].filter(x=>save.d[i]>=x).length;
const GY=320,rnd=(a,b)=>a+Math.random()*(b-a),shuf=a=>a.sort(()=>Math.random()-.5),m=(v,n)=>((v%n)+n)%n;
let scene='menu',run,P={x:60},face=1,walk=0,moving=0,doors=[],en,world,LV=1400,cam=0,T=0,timer=0,cd=0,pcd=0,boost=0,inv=0,dbl=false,swing=0,flash=0,msg='',msgT=0,k={},near=null,fx=[],punchT=0,pcd2=0;
const say=t=>{msg=t;msgT=2.2};
const addfx=(type,x,x2)=>fx.push({type,x,x2:x2||x,t:0,d:type==='fire'?.4:type==='spark'?.3:.7});
function menu(extra){
 scene='menu';
 let h='<h1>🏰 Infinite Castle of Hidden Doors</h1>'+(extra||'')+'<p>Pick your hero. Beat a world to unlock its hero.</p>';
 W.forEach((w,i)=>{const u=save.u.includes(i);
  h+=`<button class="c" ${u?'':'disabled'} data-i="${i}">${u?w.e:'🔒'} ${w.ch} of the ${w.n} · Lv ${lvl(i)}<small>${u?w.p:'Locked'}</small></button>`});
 ov.innerHTML=h;ov.style.display='block';
 ov.querySelectorAll('.c').forEach(b=>b.onclick=()=>start(+b.dataset.i));
}
function start(i){run={ch:i,cleared:new Set(),mini:false,score:0,esc:0,used:0,hp:3};ov.style.display='none';genCastle();say('Run and find a door! ▲ to enter')}
function genCastle(){
 scene='castle';LV=1400;
 const t=[];
 [0,1,2,3,4,5,6].forEach(i=>t.push(i));
 
 
 while(t.length<10)t.push('loop');
 shuf(t);doors=t.map((type,i)=>({type,x:190+i*200,used:false,a:(Math.random()*7)|0,b:(Math.random()*7)|0}));P.x=60;LV=2180;addBoss();
}
function addBoss(){
 let nw=false;
 if(run.cleared.size>=3&&!run.mini&&!doors.some(d=>d.type==='mini')){doors.push({type:'mini',x:190+doors.length*200,used:false});nw=true}
 if(run.cleared.size>=7&&run.mini&&!doors.some(d=>d.type==='final')){doors.push({type:'final',x:190+doors.length*200,used:false});nw=true}
 LV=doors[doors.length-1].x+190;
 if(nw){msg=(msgT>0?msg+' · ':'')+'Boss door appeared at the end!';msgT=3.5}
}
function enter(d){
 d.used=true;run.used++;
 if(d.type==='loop'){say('Trick door! Nothing happens.');return}
 world=d;scene='world';LV=1300;timer=90;run.esc=0;boost=inv=0;dbl=false;cd=pcd=0;P.x=60;
 en={hp:d.type==='mini'?3:d.type==='final'?5:1,s:'h',t:1,v:0,pz:0,x:0,wu:-1.5,ft:0};respawn();
 say(typeof d.type==='number'?W[d.type].e+' '+W[d.type].n:d.type==='mini'?'Mini-boss! 3 hits':'FINAL BOSS! 5 hits');
}
function respawn(){for(let i=0;i<20;i++){en.x=rnd(300,LV-80);if(Math.abs(en.x-P.x)>250)break}en.s='h';en.t=rnd(1,3);en.v=0;en.pz=0;en.wu=-1.5;en.pc=0;if(typeof world.type!=='number'){en.s='v'}}
function over(t,b,pl){scene='over';ov.style.display='block';ov.innerHTML=`<h1>${t}</h1><p>${b}</p><p>Score: ${run.score}</p><button class="c go" id="again">${pl}</button>`;$('again').onclick=()=>menu()}
const lose=w=>over('💀 Defeated',w,'Back to menu');
function mult(){return 1+.25*lvl(run.ch)+(world.type===run.ch?.5:0)}
function hit(dmg){
 en.hp-=dmg;flash=.25;addfx('spark',en.x);
 if(en.hp>0){if(typeof world.type==='number'){say('Hit! It fled…');respawn()}else{say('Boss hit! '+en.hp+' left');en.wu=-1}return}
 const pts=Math.floor(timer*10*mult()),t=world.type;run.score+=pts;save.d[run.ch]++;run.hp=Math.min(3,run.hp+1);
 if(typeof t==='number'){run.cleared.add(t);if(!save.u.includes(t)){save.u.push(t);say('Unlocked '+W[t].ch+'!')}else say('+'+pts)}
 else if(t==='mini'){run.mini=true;say('Mini-boss down! +'+pts)}
 store();
 if(t==='final'){over('🏆 You conquered the castle!','All 7 worlds, the mini-boss and the final boss fell.','Play again');return}
 scene='castle';addBoss();P.x=Math.min(P.x,60);
 
}
function strike(){
 if(scene!=='world'||cd>0)return;cd=.35;swing=.15;
 if(en.s==='v'&&Math.abs(en.x-P.x)<=(boost>0?120:75)){const d=dbl?2:1;dbl=false;hit(d)}
 else{timer-=10;flash=.25;say('Mistimed! −10s');if(timer<=0)lose('Time ran out')}
}
function punch(){
 if(scene!=='world'||pcd2>0)return;pcd2=.25;punchT=.15;
 if(en.s==='v'&&Math.abs(en.x-P.x)<=60){en.pc=(en.pc||0)+1;en.wu=-.8;addfx('spark',en.x);en.x=Math.min(LV-20,Math.max(20,en.x+Math.sign(en.x-P.x||1)*25));
  if(en.pc>=3){en.pc=0;hit(1)}else say('Punch '+en.pc+'/3')}
}
function power(){
 if(scene!=='world'||pcd>0)return;const v=en.s==='v',c=run.ch;
 if(c===0){timer=Math.min(timer+8,90);addfx('water',P.x);say('Water! +8 seconds')}
 else if(c===1){if(!v||Math.abs(en.x-P.x)>280){say('No target in range');return}addfx('fire',P.x,en.x);pcd=10;hit(1);return}
 else if(c===2){if(!v){say('No target');return}en.pz=4;addfx('poison',en.x);say('Poisoned!')}
 else if(c===3){if(!v){say('No target');return}addfx('smoke',P.x);P.x=Math.min(LV-20,en.x+40);face=-1;addfx('smoke',P.x);say('Behind you!')}
 else if(c===4){boost=4;say('Hit & run!')}
 else if(c===5){inv=7;say('Invisible 7s')}
 else if(c===6){dbl=true;say('Next strike x2')}
 pcd=10;
}
function update(dt){
 T+=dt;fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<f.d);if(scene!=='castle'&&scene!=='world')return;
 cd-=dt;pcd2-=dt;punchT-=dt;pcd-=dt;boost-=dt;inv-=dt;swing-=dt;flash-=dt;msgT-=dt;
 const dx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0);moving=dx!==0;
 if(dx){face=dx;walk+=dt*14}
 P.x=Math.max(20,Math.min(LV-20,P.x+dx*150*(boost>0?1.8:1)*dt));
 cam=Math.max(0,Math.min(LV-360,P.x-150));
 if(scene==='castle'){
  near=doors.find(d=>!d.used&&Math.abs(P.x-d.x)<28)||null;
  if(near&&(k.w||k.arrowup)){k.w=k.arrowup=0;enter(near)}
 }else{
  timer-=dt;if(timer<=0){lose('Time ran out');return}
  if(en.s==='h'){en.t-=dt;if(en.t<=0){en.s='v';en.v=0}}
  else{
   if(inv<=0)en.v+=dt;
   const ed=P.x-en.x,ad=Math.abs(ed);
   if(inv<=0&&ad>55)en.x+=Math.sign(ed)*(world.type==='final'?45:world.type==='mini'?35:28)*dt;
   if(en.wu<0)en.wu+=dt;else if(ad<90&&inv<=0)en.wu+=dt;else en.wu=0;
   en.ft-=dt;const pn=ad<50,need=pn?.35:.8;
   if(en.wu>=need){en.wu=pn?-1:-1.6;en.ft=.2;en.pk=pn;if(ad<(pn?58:95)){run.hp--;flash=.3;P.x=Math.max(20,Math.min(LV-20,P.x+Math.sign(ed||1)*60));say(pn?'Punched! −1 ❤':'Ouch! −1 ❤');if(run.hp<=0){lose('The demon defeated you');return}}}
   if(en.pz>0){en.pz-=dt;if(en.pz<=0){hit(1);return}}
   if(en.v>=16&&typeof world.type==='number'){run.esc++;if(run.esc>=2){lose('A demon escaped twice');return}say('It escaped! (1 more = defeat)');respawn()}
  }
 }
}
/* ---------- drawing ---------- */
function poly(pts,c){g.fillStyle=c;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill()}
function bg(i){
 const th=i<0?{s:['#150d2a','#3a2060'],g:'#5a3a22'}:W[i],gr=g.createLinearGradient(0,0,0,GY);
 gr.addColorStop(0,th.s[0]);gr.addColorStop(1,th.s[1]);g.fillStyle=gr;g.fillRect(0,0,360,400);
 if(i<0){
  for(let n=0;n<9;n++){const x=m(n*170-cam*.3,1530)-100,y=50+(n*53)%110;
   g.fillStyle='#24163f';g.fillRect(x,y,90,50);poly([[x-8,y],[x+45,y-26],[x+98,y]],'#3a2060');
   g.fillStyle='#ffcf66';g.fillRect(x+14,y+14,12,14);g.fillRect(x+60,y+14,12,14)}
  g.fillStyle='#3b2412';g.fillRect(0,110,360,GY-110);
  for(let n=0;n<14;n++){const x=m(n*60-cam,840)-60;g.fillStyle=n%2?'#4a2f18':'#43291a';g.fillRect(x,110,58,GY-110)}
  for(let n=0;n<7;n++){const x=m(n*140-cam,980)-70;g.fillStyle='#2a1608';g.fillRect(x,110,10,GY-110);
   g.strokeStyle='#2a1608';g.beginPath();g.moveTo(x+5,110);g.lineTo(x+5,150);g.stroke();
   g.fillStyle='#ff7a3a';g.beginPath();g.ellipse(x+5,160,10,14,0,0,7);g.fill();g.fillStyle='#ffd27a';g.beginPath();g.ellipse(x+5,160,5,8,0,0,7);g.fill()}
 }else if(i===0){
  g.fillStyle='#f3f1d0';g.beginPath();g.arc(280,70,26,0,7);g.fill();
  [[.2,'#1c5a92',250],[.5,'#17487a',280]].forEach(([f,c,y])=>{g.fillStyle=c;g.beginPath();g.moveTo(0,400);for(let x=0;x<=360;x+=10)g.lineTo(x,y+Math.sin((x+cam*f)/22+T*2)*8);g.lineTo(360,400);g.fill()});
 }else if(i===1){
  for(let n=0;n<8;n++){const x=m(n*140-cam*.5,1120)-80;g.fillStyle='#1a0a08';g.fillRect(x,GY-80,90,80);poly([[x-10,GY-80],[x+45,GY-125],[x+100,GY-80]],'#140706');
   const f=18+Math.sin(T*9+n)*6;poly([[x+10,GY-80],[x+30,GY-80-f-30],[x+50,GY-80],[x+70,GY-80-f-20],[x+88,GY-80]],'#ff8a1f');poly([[x+30,GY-80],[x+45,GY-80-f-10],[x+60,GY-80]],'#ffd84a')}
  g.fillStyle='#ffb05a';for(let n=0;n<18;n++)g.fillRect(m(n*53-cam*.9+T*20,360),m(300-n*31-T*40,330),2,2);
 }else if(i===2){
  for(let n=0;n<7;n++){const x=m(n*160-cam*.5,1120)-80;g.fillStyle='#5a3a2a';g.fillRect(x+30,GY-100,14,100);
   g.fillStyle='#f27aa8';[[0,-120,38],[-26,-96,30],[28,-96,30]].forEach(a=>{g.beginPath();g.arc(x+37+a[0],GY+a[1],a[2],0,7);g.fill()})}
  g.fillStyle='#fff';for(let n=0;n<20;n++)g.fillRect(m(n*47-cam*.9-T*25,360),m(n*37+T*40,330),4,3);
 }else if(i===3){
  for(let n=0;n<12;n++){const x=m(n*80-cam*.4,960)-60,h=90+(n*37)%110;g.fillStyle=n%2?'#151b33':'#1c2442';g.fillRect(x,GY-h,66,h);
   g.fillStyle='#ffd84a';for(let r=0;r<h/22|0;r++){if((n+r)%3)g.fillRect(x+10,GY-h+8+r*22,10,10);if((n*r)%2)g.fillRect(x+40,GY-h+8+r*22,10,10)}}
 }else if(i===4){
  g.fillStyle='#2a1a22';for(let n=0;n<6;n++){const x=m(n*200-cam*.3,1200)-100;g.beginPath();g.moveTo(x,GY);g.lineTo(x+80,GY-110);g.lineTo(x+160,GY);g.fill()}
  for(let n=0;n<6;n++){const x=m(n*92+T*70,552)-100;g.fillStyle=n?'#6a3a22':'#2a2a2a';g.fillRect(x,GY-62,86,46);g.fillStyle='#ffe28a';g.fillRect(x+8,GY-52,16,14);g.fillRect(x+34,GY-52,16,14);g.fillRect(x+60,GY-52,16,14)}
 }else if(i===5){
  for(let n=0;n<6;n++){const x=m(n*170-cam*.4,1020)-80;g.fillStyle='#2a1230';g.fillRect(x,GY-70,90,70);poly([[x-6,GY-70],[x+45,GY-100],[x+96,GY-70]],'#3a1a44')}
  for(let n=0;n<16;n++){const x=m(n*60-cam*.6,960)-30,y=70+Math.sin(T*2+n)*8;g.strokeStyle='#fff6';g.beginPath();g.moveTo(x,0);g.lineTo(x,y);g.stroke();
   g.fillStyle=n%2?'#e0472b':'#ffae33';g.beginPath();g.ellipse(x,y+10,9,12,0,0,7);g.fill()}
  const b=(T*.8)%3,fx=[90,230,170][b|0],fy=[90,70,110][b|0];g.strokeStyle='#ffd';for(let a=0;a<12;a++){const r=(b%1)*40;g.beginPath();g.moveTo(fx+Math.cos(a/12*6.28)*r*.6,fy+Math.sin(a/12*6.28)*r*.6);g.lineTo(fx+Math.cos(a/12*6.28)*r,fy+Math.sin(a/12*6.28)*r);g.stroke()}
 }else{
  const x=-cam*.35+30;g.fillStyle='#0c1a14';g.fillRect(x,GY-170,420,170);poly([[x-10,GY-170],[x+210,GY-215],[x+430,GY-170]],'#08120e');
  g.fillStyle='#c8ff9a';for(let r=0;r<3;r++)for(let c=0;c<9;c++)if((r*c+c)%4)g.fillRect(x+16+c*45,GY-150+r*46,18,26);
  g.fillStyle='#ffffff18';for(let n=0;n<5;n++)g.fillRect(m(n*120-cam*.8+T*10,480)-60,GY-60-n*14,180,22);
 }
 g.fillStyle=th.g;g.fillRect(0,GY,360,80);g.fillStyle='#ffffff22';g.fillRect(0,GY,360,3);
 g.fillStyle='#0003';for(let n=0;n<10;n++)g.fillRect(m(n*70-cam,700)-20,GY+20+(n%3)*16,34,3);
}
function drawDoor(d){
 const x=d.x-cam,[c,e,nm]=d.type==='loop'?[W[d.a].c,W[d.a].e+W[d.b].e,'???']:d.type==='mini'?['#a22','👺','Mini-boss']:d.type==='final'?['#c9a227','🐉','FINAL']:[W[d.type].c,W[d.type].e,W[d.type].n];
 g.fillStyle=d.used?'#241c30':c;g.fillRect(x-26,GY-82,52,82);g.beginPath();g.arc(x,GY-82,26,Math.PI,0);g.fill();
 if(d.type==='loop'&&!d.used){g.fillStyle=W[d.b].c;g.fillRect(x,GY-82,26,82);g.beginPath();g.moveTo(x,GY-82);g.arc(x,GY-82,26,-Math.PI/2,0);g.fill()}
 g.strokeStyle='#fffa';g.lineWidth=2;g.strokeRect(x-26,GY-82,52,82);g.beginPath();g.arc(x,GY-82,26,Math.PI,0);g.stroke();g.lineWidth=1;
 g.textAlign='center';g.textBaseline='middle';g.font=(d.type==='loop'?'18px':'26px')+' serif';g.fillStyle='#fff';g.fillText(d.used?'🔒':e,x,GY-52);
 g.font='bold 10px sans-serif';g.fillText(nm,x,GY-118);
}
function human(x,y,c,fc,sw,s,al){
 g.save();g.globalAlpha=al;g.translate(x,y);g.scale(fc*1.25,1.25);g.lineCap='round';
 g.fillStyle='#0005';g.beginPath();g.ellipse(0,20,11,3.5,0,0,7);g.fill();
 g.strokeStyle='#222';g.lineWidth=4;g.beginPath();g.moveTo(-3,6);g.lineTo(-3+s,17);g.moveTo(3,6);g.lineTo(3-s,17);g.stroke();
 g.fillStyle=c;g.fillRect(-7,-8,14,15);g.fillStyle='#111';g.fillRect(-7,2,14,3);
 g.fillStyle='#f1c9a0';g.beginPath();g.arc(0,-13,6,0,7);g.fill();
 g.fillStyle='#1a1a1a';g.beginPath();g.arc(0,-14,6.5,Math.PI,0);g.fill();g.fillRect(-6.5,-14,3,5);
 g.fillStyle='#000';g.fillRect(2,-13,1.6,1.6);
 const a=sw>0?-1.3+(0.15-sw)/0.15*2.6:0.5+s*.04;g.save();g.translate(5,-4);g.rotate(a);
 g.strokeStyle='#f1c9a0';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(8,0);g.stroke();
 g.strokeStyle='#e8eef5';g.beginPath();g.moveTo(8,0);g.lineTo(26,0);g.stroke();
 g.strokeStyle='#caa24a';g.beginPath();g.moveTo(8,-4);g.lineTo(8,4);g.stroke();g.restore();g.restore();
}
function demon(x,y,sc,poison){
 g.save();g.translate(x,y);g.scale(sc,sc);
 g.fillStyle='#0005';g.beginPath();g.ellipse(0,22,16,4,0,0,7);g.fill();
 g.fillStyle=poison?'#6a2a8a':'#8a1f2a';g.fillRect(-12,-12,24,28);g.fillRect(-10,14,7,8);g.fillRect(3,14,7,8);

   else if(f.type==='fire'){const fx2=f.x+(f.x2-f.x)*Math.min(1,p*1.6)-cam;g.fillStyle='#ff7a1a';g.beginPath();g.arc(fx2,GY-30,12+Math.sin(T*30)*2,0,7);g.fill();g.fillStyle='#ffe27a';g.beginPath();g.arc(fx2,GY-30,6,0,7);g.fill()}

 }
