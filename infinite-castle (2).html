<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Castle of Hidden Doors</title>
<style>
:root{--bg:#efe9f3;--fg:#1b1530;--pn:#ffffff;--ac:#b3263e;--mu:#675f7c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a16;--fg:#ece8f7;--pn:#1a1630;--ac:#ff4d6a;--mu:#a19ab9}}
:root[data-theme="dark"]{--bg:#0b0a16;--fg:#ece8f7;--pn:#1a1630;--ac:#ff4d6a;--mu:#a19ab9}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Hiragino Mincho ProN","Yu Mincho",Georgia,serif;display:flex;flex-direction:column;align-items:center}
#wrap{position:relative;width:100%;max-width:820px;padding:0 6px;box-sizing:border-box}
#hud{display:flex;flex-wrap:wrap;gap:2px 14px;padding:8px 4px;font-weight:700;font-size:14px}
canvas{width:100%;display:block;border-radius:12px;box-shadow:0 8px 30px #0006;border:2px solid #3a2a4e;touch-action:none;background:#0b0a16}
#ov{position:absolute;left:6px;right:6px;top:40px;bottom:0;background:radial-gradient(ellipse at 50% 30%,rgba(60,20,50,.93),rgba(8,6,20,.96));color:#ece8f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;border-radius:8px;overflow:auto;box-sizing:border-box}
#ov h1{margin:0;font-size:30px;color:#ff4d6a;letter-spacing:.03em;text-shadow:0 0 18px #ff4d6a88,0 2px 0 #000}
#ov p{margin:0;max-width:440px;color:#cfc9e4}
button{font:inherit;font-weight:700;border:2px solid var(--ac);background:var(--pn);color:var(--fg);border-radius:8px;padding:10px 14px;cursor:pointer;touch-action:manipulation;user-select:none}
#ov button{background:#1a1630;color:#ece8f7}
button{transition:transform .1s,background .15s}button:active:not(:disabled){transform:scale(.93)}#ov button:hover:not(:disabled){background:#2c2350;box-shadow:0 0 14px #ff4d6a66}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid #ffd166}
.hs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#tb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 0;width:100%}
#tb button{padding:12px 0;font-size:18px}
#help{color:var(--mu);font-size:12px;padding:0 4px 12px;text-align:center}
</style></head><body>
<div id="wrap">
<div id="hud"></div>
<canvas id="cv" width="800" height="400"></canvas>
<div id="ov"></div>
<div id="tb">
<button data-k="L" aria-label="Left">◀</button><button data-k="R" aria-label="Right">▶</button>
<button data-k="up" aria-label="Enter door">▲</button><button data-k="sword" aria-label="Sword">⚔</button>
<button data-k="punch" aria-label="Punch">👊</button><button data-k="power" aria-label="Power">✨</button>
</div>
<div id="help">◀ ▶ run · ▲ enter door · Space sword · ▼/Shift punch · right-click power · H switch hero in castle · tap screen = sword</div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$("#cv"),ctx=cv.getContext("2d"),ov=$("#ov");
const HE=[["Kagaya","#4aa3ff","Water: +8 seconds"],["Giyu","#ff8a3d","Fire: strikes from afar"],["Kocho","#b07cff","Poison: slow damage"],["Iguro","#7bd88f","Teleport behind the demon"],["Kanroji","#ff7eb6","Faster moves and attacks"],["Amane","#e8e8ff","Invisible for 7 seconds"],["Gyomei","#c9b79c","Extra strength and damage"]];
const WO=[["Water Lake","🌊","#1f5f9e"],["Fire Cave","🔥","#b84a12"],["Poison Garden","🦋","#6a3fb0"],["Snake City","🐍","#2e7d4a"],["Mugen Train","🚂","#8a2a3e"],["Moon Shrine","🌙","#5a5f8a"],["Stone Gate","⛰️","#6b5a44"]];
let sv={unl:[0],wins:0};
try{const s=JSON.parse(localStorage.getItem("icd")||"null");if(s&&s.unl)sv=s}catch(e){}
const saveG=()=>{try{localStorage.setItem("icd",JSON.stringify(sv))}catch(e){}};
const lvl=()=>sv.wins>=7?3:sv.wins>=5?2:sv.wins>=3?1:0;
const CW=1950,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=[],ST=Array.from({length:60},(_,i)=>[(i*137)%800,(i*59)%210,(i%3)+1,i]);let sh=0,T=0;
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*160;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:.5+Math.random()*.4,c})}}
function pop(t,x,y,c){P.push({x,y,vx:0,vy:-40,l:.9,c,t})}
function drawP(dt){for(let i=P.length-1;i>=0;i--){const q=P[i];q.l-=dt;if(q.l<=0){P.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;if(!q.t)q.vy+=300*dt;ctx.globalAlpha=Math.min(1,q.l*2);if(q.t)text(q.t,q.x,q.y,18,q.c);else{ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4)}}ctx.globalAlpha=1}
let g,f,mode="title",keys={},hero=0;

function show(h){ov.innerHTML=h;ov.style.display="flex"}
function hide(){ov.style.display="none"}
function title(){mode="title";show(`<h1>Infinite Castle of Hidden Doors</h1><p>It’s midnight, and you’re a demon slayer inside the Infinite Castle. Each door’s look shows the world behind it, but some doors only lead back to the castle.</p><p>Clear all 7 worlds, beat the mini-boss, then face the final boss.</p><button onclick="pickScreen()">Choose your hero</button>`)}
function pickScreen(){mode="title";show(`<h1>Choose your hero</h1><div class="hs">${HE.map((h,i)=>`<button ${sv.unl.includes(i)?"":"disabled"} onclick="pick(${i})" style="border-color:${h[1]}">${sv.unl.includes(i)?"":"🔒 "}${h[0]}<br><small>${sv.unl.includes(i)?h[2]:"Clear "+WO[i][0]}</small></button>`).join("")}</div><p>Level ${lvl()} · ${sv.wins} total wins. Beat a world to unlock its hero.</p>`)}
function pick(i){hero=i;newRun()}
function newRun(){
 const ids=[0,1,2,3,4,5,6,-1,-1,-1].sort(()=>Math.random()-.5);ids.push("m","F");
 g={px:60,face:1,doors:ids.map((w,i)=>({w,x:140+i*150,used:false,look:w===-1?Math.floor(Math.random()*7):w})),cl:[],used:0,score:0,mini:false,msg:"",mt:0};
 f=null;mode="castle";hide();say("Find a door and press ▲ to enter.")}
function say(m){g.msg=m;g.mt=3.5}
function cycle(){const u=sv.unl;hero=u[(u.indexOf(hero)+1)%u.length];say("Hero: "+HE[hero][0])}

function enter(){
 const d=g.doors.find(d=>Math.abs(d.x-g.px)<36);if(!d||d.used)return;
 if(d.w==="m"&&g.cl.length<3)return say("The golden door is sealed. Clear 3 worlds first.");
 if(d.w==="F"&&(g.cl.length<7||!g.mini))return say("The final door is sealed. Clear all 7 worlds and the mini-boss.");
 d.used=true;g.used++;
 if(d.w===-1)return say("It was a trick. This door leads back to the castle and closes.");
 f={d,k:d.w==="m"?1:d.w==="F"?2:0,t:90,h:3,esc:0,x:100,face:1,cd:0,pc:0,pw:0,sp:0,inv:0,st:0,fire:0,hurt:0,sw:0,miss:0,rs:0,m:null};
 spawn();mode="fight"}
function spawn(){
 const hp=[3,8,14][f.k];let x;do{x=80+Math.random()*640}while(Math.abs(x-f.x)<220);
 f.m={x,hp,mx:hp,life:f.k?1e9:16,cd:1.2,pois:0,fl:0}}

function hit(m,d){m.hp-=d*(f.st>0?2:1);m.fl=.15;sh=.18;burst(m.x,290,'#ffd166',10);pop('-'+d*(f.st>0?2:1),m.x,240,'#fff');if(m.hp<=0)kill()}
function kill(){
 const k=f.k,wi=f.d.w,secs=Math.max(0,Math.ceil(f.t));
 let pts=secs*10*(1+.25*lvl());if(k===0&&hero===wi)pts*=1.5;pts=Math.round(pts);
 burst(f.m?f.m.x:400,290,'#ff4d6a',40);g.score+=pts;sv.wins++;let note="";
 if([3,5,7].includes(sv.wins))note+=" Hero level up!";
 if(k===0){g.cl.push(wi);if(!sv.unl.includes(wi)){sv.unl.push(wi);note+=` ${HE[wi][0]} unlocked!`}}
 if(k===1)g.mini=true;
 saveG();f=null;
 if(k===2){mode="end";show(`<h1>You win!</h1><p>The Infinite Castle falls silent. Final score: <b>${g.score}</b>. Doors used: ${g.used}.</p><button onclick="pickScreen()">Play again</button>`);return}
 mode="castle";say(`Demon defeated! +${pts} points.${note}`)}
function lose(r){f=null;mode="end";show(`<h1>Defeated</h1><p>${r}</p><p>Score: <b>${g.score}</b> · Worlds cleared: ${g.cl.length}/7</p><button onclick="pickScreen()">Try again</button>`)}

function act(a){
 if(mode==="castle"){if(a==="up")enter();return}
 if(mode!=="fight"||!f)return;const m=f.m;if(!m)return;
 const dx=m.x-f.x,fr=dx*f.face>0;
 if(a==="sword"&&f.cd<=0){f.cd=f.sp>0?.15:.35;f.sw=.15;
  if(fr&&Math.abs(dx)<80)hit(m,f.k?4:99);else{f.t-=10;f.miss=.6}}
 else if(a==="punch"&&f.pc<=0){f.pc=f.sp>0?.12:.25;f.sw=.12;if(fr&&Math.abs(dx)<55)hit(m,1)}
 else if(a==="power"&&f.pw<=0){f.pw=10;
  if(hero===0)f.t+=8;
  else if(hero===2)m.pois=6;
  else if(hero===3){const s=Math.sign(dx)||1;f.x=cl(m.x+s*45,20,780);f.face=-s}
  else if(hero===4)f.sp=5;
  else if(hero===5)f.inv=7;
  else if(hero===6)f.st=6;
  else if(hero===1){f.fire=.3;if(fr)hit(m,3)}}}

function upd(dt){
 const sp=mode==="fight"&&f.sp>0?260:mode==="fight"?150:170;
 const o=mode==="fight"?f:g;
 if(mode!=="castle"&&mode!=="fight")return;
 if(keys.ArrowLeft){o.x===undefined?g.px-=sp*dt:o.x-=sp*dt;o.face=-1}
 if(keys.ArrowRight){o.x===undefined?g.px+=sp*dt:o.x+=sp*dt;o.face=1}
 if(mode==="castle"){g.px=cl(g.px,30,CW-30);g.mt-=dt;return}
 f.x=cl(f.x,20,780);
 f.t-=dt;["cd","pc","pw","sp","inv","st","fire","hurt","sw","miss"].forEach(k=>f[k]-=dt);
 const m=f.m;
 if(m){
  m.life-=dt;m.fl-=dt;
  if(m.pois>0){m.pois-=dt;m.hp-=.5*dt;if(m.hp<=0)return kill()}
  if(f.inv<=0){const dx=f.x-m.x;
   if(Math.abs(dx)>34)m.x+=Math.sign(dx)*(f.k?55:35)*dt;
   m.cd-=dt;m.sl=(m.sl||0)-dt;if(m.at>0){m.at-=dt;if(m.at<=0){m.sl=.2;if(Math.abs(f.x-m.x)<=64){f.h--;f.hurt=.4;sh=.3;burst(f.x,290,'#ff4d4d',16)}}}else if(Math.abs(dx)<=50&&m.cd<=0){m.cd=1.4;m.at=.4}}
  if(m.life<=0){f.esc++;f.m=null;f.rs=1.2;if(f.esc>=2)return lose("Two demons escaped.")}
 }else{f.rs-=dt;if(f.rs<=0)spawn()}
 if(f.h<=0)return lose("Your hearts ran out.");
 if(f.t<=0)return lose("Time ran out.")}

function fig(x,c,face,sw,flash,demon){
 ctx.save();ctx.translate(x,330);
 ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(0,0,18,5,0,0,7);ctx.fill();
 const b=Math.sin(T*6+x)*1.5;ctx.translate(0,b);ctx.fillStyle=flash?"#fff":c;
 if(!demon){ctx.fillStyle=flash?"#fff":"#00000055";ctx.beginPath();ctx.moveTo(-face*8,-44);ctx.lineTo(-face*(26+Math.sin(T*8)*3),-8);ctx.lineTo(-face*4,-8);ctx.fill();ctx.fillStyle=flash?"#fff":c}
 ctx.fillRect(-10,-46,20,36);ctx.fillRect(-9,-10,7,10);ctx.fillRect(3,-10,7,10);
 ctx.fillStyle=flash?"#fff":"#0003";ctx.fillRect(-10,-26,20,5);ctx.fillStyle=flash?"#fff":c;
 ctx.beginPath();ctx.arc(0,-57,10,0,7);ctx.fill();
 if(demon){ctx.beginPath();ctx.moveTo(-9,-62);ctx.lineTo(-5,-80);ctx.lineTo(-1,-64);ctx.moveTo(9,-62);ctx.lineTo(5,-80);ctx.lineTo(1,-64);ctx.fill();ctx.shadowColor="#ffe14d";ctx.shadowBlur=10;ctx.fillStyle="#ffe14d";ctx.fillRect(-6,-60,4,4);ctx.fillRect(2,-60,4,4);ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.fillRect(-4,-52,2,3);ctx.fillRect(2,-52,2,3)}
 else{ctx.shadowColor=c;ctx.shadowBlur=sw>0?16:6;ctx.strokeStyle="#e8f4ff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(face*10,-34);ctx.lineTo(face*(sw>0?58:26),sw>0?-34:-52);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.fillRect(face*5-2,-60,5,5);ctx.fillStyle="#222";ctx.fillRect(face*6-1,-59,3,3);ctx.fillStyle=c;ctx.fillRect(-10,-48,20,4)}
 ctx.restore()}
function bar(x,y,w,p,c){ctx.fillStyle="#0008";ctx.fillRect(x-w/2,y,w,5);ctx.fillStyle=c;ctx.fillRect(x-w/2,y,w*cl(p,0,1),5)}
function text(t,x,y,s,c){ctx.font=`700 ${s}px Georgia,serif`;ctx.textAlign="center";ctx.fillStyle=c||"#fff";ctx.fillText(t,x,y)}

function drawC(){
 const cam=cl(g.px-400,0,CW-800);
 let gr=ctx.createLinearGradient(0,0,0,400);gr.addColorStop(0,"#0b0a22");gr.addColorStop(1,"#2a1330");ctx.fillStyle=gr;ctx.fillRect(0,0,800,400);
 ST.forEach(q=>{ctx.globalAlpha=.4+.6*Math.abs(Math.sin(T*1.5+q[3]));ctx.fillStyle="#fff";ctx.fillRect(q[0],q[1],q[2],q[2])});ctx.globalAlpha=1;
 ctx.shadowColor="#f4eecb";ctx.shadowBlur=30;ctx.fillStyle="#f4eecb";ctx.beginPath();ctx.arc(660,70,32,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#0b0a22";ctx.beginPath();ctx.arc(674,62,28,0,7);ctx.fill();
 ctx.fillStyle="#150f2a";for(let i=-1;i<12;i++){const x=i*200-cam*.4%200;ctx.beginPath();ctx.moveTo(x,230);ctx.lineTo(x+60,150);ctx.lineTo(x+120,230);ctx.fill();ctx.fillRect(x+10,230,100,100)}
 ctx.fillStyle="#2b1f3a";ctx.fillRect(0,330,800,70);ctx.fillStyle="#6a2a3a";ctx.fillRect(0,330,800,4);ctx.fillStyle="#ffffff0d";for(let i=0;i<14;i++)ctx.fillRect(((i*70-cam)%840+840)%840-20,334,3,66);
 let near=null;
 g.doors.forEach(d=>{const x=d.x-cam;if(x<-60||x>860)return;
  const boss=d.w==="m"||d.w==="F",lock=(d.w==="m"&&g.cl.length<3)||(d.w==="F"&&(g.cl.length<7||!g.mini));
  const c=boss?(d.w==="m"?"#b8902a":"#8a1220"):WO[d.look][2];
  const nr=Math.abs(d.x-g.px)<36&&!d.used;ctx.save();if(nr){ctx.shadowColor=c;ctx.shadowBlur=24+Math.sin(T*5)*8}ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x-32,220,64,110,[32,32,0,0]);ctx.fill();ctx.restore();ctx.fillStyle="#0004";ctx.beginPath();ctx.roundRect(x-24,230,48,100,[24,24,0,0]);ctx.fill();ctx.fillStyle="#ffd166";ctx.fillRect(x+16,286,4,4);
  ctx.strokeStyle="#000a";ctx.lineWidth=3;ctx.stroke();
  ctx.font="26px serif";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.fillText(boss?(lock?"🔒":d.w==="m"?"👹":"👺"):WO[d.look][1],x,282);
  if(d.used){ctx.fillStyle="#000b";ctx.beginPath();ctx.roundRect(x-32,220,64,110,[32,32,0,0]);ctx.fill();text("closed",x,282,12,"#bbb")}
  if(Math.abs(d.x-g.px)<36&&!d.used)near=boss?(d.w==="m"?"Mini-boss door":"Final door"):WO[d.look][0]});
 fig(g.px-cam,HE[hero][1],g.face,0,0,0);
 if(near)text("▲ "+near,g.px-cam,240,14,"#ffd166");
 if(g.mt>0)text(g.msg,400,40,16,"#ffd166");
 ctx.fillStyle="#fff3";ctx.fillRect(250,380,300,6);ctx.fillStyle="#ff4d6a";ctx.fillRect(250,380,300*g.px/CW,6)}


function sky(a,b){const q=ctx.createLinearGradient(0,0,0,330);q.addColorStop(0,a);q.addColorStop(1,b);ctx.fillStyle=q;ctx.fillRect(0,0,800,400)}
function gnd(c,l){ctx.fillStyle=c;ctx.fillRect(0,330,800,70);ctx.fillStyle=l;ctx.fillRect(0,330,800,3)}
function stars(n){ctx.fillStyle="#fff";for(let i=0;i<n;i++){ctx.globalAlpha=.3+.7*Math.abs(Math.sin(T+i));ctx.fillRect((i*131)%800,(i*47)%180,2,2)}ctx.globalAlpha=1}
function bgW(w){
 if(w===0){sky("#06142e","#1f5f9e");stars(30);
  ctx.fillStyle="#f4eecb";ctx.beginPath();ctx.arc(620,80,26,0,7);ctx.fill();
  const o=ctx.createLinearGradient(0,205,0,330);o.addColorStop(0,"#1b6fb8");o.addColorStop(1,"#082347");ctx.fillStyle=o;ctx.fillRect(0,205,800,125);
  ctx.fillStyle="#f4eecb55";for(let i=0;i<5;i++)ctx.fillRect(620-24+i*3+Math.sin(T*2+i)*6,212+i*16,48-i*7,4);
  ctx.fillStyle="#04101f";ctx.fillRect(110,194,84,14);ctx.fillRect(150,140,4,56);ctx.beginPath();ctx.moveTo(156,142);ctx.lineTo(190,188);ctx.lineTo(156,188);ctx.fill();
  ctx.lineWidth=2;for(let r=0;r<5;r++){ctx.strokeStyle="#ffffff"+(r<2?"22":"3a");ctx.beginPath();for(let x=0;x<=800;x+=16){const y=222+r*20+Math.sin(x/38+T*2+r)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
  ctx.fillStyle="#ffffff44";for(let i=0;i<8;i++)ctx.fillRect((i*110+T*10)%800,300-((T*30+i*40)%80),3,3);
  gnd("#3a2a1c","#8a6a3e");ctx.fillStyle="#0006";for(let i=0;i<10;i++)ctx.fillRect(i*80,334,3,66)}
 else if(w===1){sky("#1a0505","#8a2a08");
  for(let i=0;i<6;i++){const x=i*140+20,h=70+(i*37)%50;ctx.fillStyle="#150808";ctx.fillRect(x,330-h,96,h);ctx.beginPath();ctx.moveTo(x-8,330-h);ctx.lineTo(x+48,330-h-34);ctx.lineTo(x+104,330-h);ctx.fill();
   ctx.fillStyle="#ffb03a";ctx.fillRect(x+16,330-h+16,16,16);ctx.fillRect(x+60,330-h+16,16,16);
   for(let j=0;j<3;j++){const fh=18+Math.sin(T*9+i+j*2)*7;ctx.fillStyle=j%2?"#ff7a1a":"#ffcf40";ctx.beginPath();ctx.moveTo(x+8+j*34,330-h-4);ctx.quadraticCurveTo(x+16+j*34,330-h-fh*2,x+26+j*34,330-h-4);ctx.fill()}}
  ctx.fillStyle="#ff8a3d";for(let k=0;k<30;k++)ctx.fillRect((k*83+Math.sin(T+k)*20)%800,330-((T*45+k*53)%300),2,2);
  gnd("#26100a","#c2410c")}
 else if(w===2){sky("#120826","#4b2a86");stars(18);
  ctx.fillStyle="#b07cff22";for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(120+i*220+Math.sin(T+i)*30,300,140,30,0,0,7);ctx.fill()}
  const cs=["#ff7eb6","#b07cff","#7bd88f","#ffd166","#e8e8ff"];
  for(let i=0;i<26;i++){const x=i*31+8,h=34+(i*17)%56,sw=Math.sin(T*1.5+i)*3;ctx.strokeStyle="#2e7d4a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,332);ctx.quadraticCurveTo(x+sw,332-h/2,x+sw*1.5,332-h);ctx.stroke();
   ctx.fillStyle=cs[i%5];for(let a=0;a<5;a++){ctx.beginPath();ctx.arc(x+sw*1.5+Math.cos(a*1.26)*7,332-h+Math.sin(a*1.26)*7,5,0,7);ctx.fill()}ctx.fillStyle="#fff3a0";ctx.beginPath();ctx.arc(x+sw*1.5,332-h,4,0,7);ctx.fill()}
  ctx.font="22px serif";ctx.textAlign="center";for(let k=0;k<5;k++)ctx.fillText("🦋",(k*170+T*30)%800,150+Math.sin(T*2+k)*40);
  gnd("#1d1236","#7bd88f")}
 else if(w===3){sky("#07130d","#1d4a35");stars(20);
  ctx.strokeStyle="#2e7d4a88";ctx.lineWidth=12;ctx.beginPath();for(let x=0;x<=800;x+=10){const y=110+Math.sin(x/32+T*2)*16;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
  for(let i=0;i<10;i++){const x=i*84,h=90+(i*53)%120;ctx.fillStyle="#06100b";ctx.fillRect(x,330-h,80,h);
   for(let yy=14;yy<h-10;yy+=24)for(let xx=10;xx<70;xx+=22)if((i*7+xx+yy)%3){ctx.fillStyle="#ffd166";ctx.fillRect(x+xx,330-h+yy,10,12)}}

addEventListener("keydown",e=>{

 else if(k==="ArrowUp"){act("up");e.preventDefault()}

addEventListener("keyup",e=>{delete keys[e.key]});
